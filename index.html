<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Yard and mowing services for Your Neighborhood" />

    <link rel="stylesheet" type="text/css" href="vendors/css/normalize.css" />
    <link rel="stylesheet" type="text/css" href="vendors/css/grid.css" />

    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;1,100&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet"/>

    <link rel="stylesheet" type="text/css" href="resources/css/style.css" />
    <link rel="stylesheet" type="text/css" href="resources/css/queries.css" />

    <title>Lawn and Yard Services</title>
  </head>

  <body>
    <header>
      <nav>
        <div class="row">
          <div class="logo">Lawn and Yard Services</div>
          <ul class="main-nav">
            <li><a href="#about-us">About us</a></li>
            <li><a href="#contact">Contact</a></li>
          </ul>
        </div>
      </nav>

      <div class="hero-text-box">
        <h1>Your Local Neighborhood Landscaper</h1>
        <a class="btn btn-full" href="#contact">Contact Us For Free Quote</a>
      </div>
    </header>

    <!-- ABOUT -->
    <section class="section-about-us" id="about-us">
      <div class="row">
        <h2>Licensed — Insured — Bonded</h2>
      </div>

      <div class="row">
        <div class="col span-1-of-4 box">
          <ion-icon name="calendar-outline" class="about-us-icon"></ion-icon>
          <h3>Flexible Scheduling</h3>
        </div>

        <div class="col span-1-of-4 box">
          <ion-icon name="home-outline" class="about-us-icon"></ion-icon>
          <h3>Yard Services</h3>
        </div>

        <div class="col span-1-of-4 box">
          <ion-icon name="leaf-outline" class="about-us-icon"></ion-icon>
          <h3>Tree Services</h3>
        </div>

        <div class="col span-1-of-4 box">
          <ion-icon name="earth-outline" class="about-us-icon"></ion-icon>
          <h3>Earth Friendly</h3>
        </div>
      </div>
    </section>

    <!-- CONTACT -->
    <section class="section-form" id="contact">
      <div class="row">
        <h2>Contact Us For a Free Quote</h2>
      </div>

      <div class="row">
        <form class="contact-form">
          <div class="row">
            <div class="col span-1-of-3">
              <label>Name</label>
            </div>
            <div class="col span-2-of-3">
              <input type="text" placeholder="Your name" required />
            </div>
          </div>

          <div class="row">
            <div class="col span-1-of-3">
              <label>Email</label>
            </div>
            <div class="col span-2-of-3">
              <input type="email" placeholder="Your email" required />
            </div>
          </div>

          <div class="row">
            <div class="col span-1-of-3">
              <label>Message</label>
            </div>
            <div class="col span-2-of-3">
              <textarea placeholder="Tell us about your yard"></textarea>
            </div>
          </div>

          <div class="row">
            <div class="col span-1-of-3"></div>
            <div class="col span-2-of-3">
              <input type="submit" value="Send Message" />
            </div>
          </div>
        </form>
      </div>
    </section>

    <footer>
      <div class="row">
        <p>© 2026 Lawn and Yard Services</p>
      </div>
    </footer>
  </body>
</html>
